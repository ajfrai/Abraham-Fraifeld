<!doctype html>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Simple To-Do</title>
<style>
  /* Layout: one centered column, a header, the input, then the list and its footer. */
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --fg: #1d1f1c;
    --muted: #6b6f68;
    --line: #dcdad3;
    --accent: #1f6f5c;
    --accent-fg: #ffffff;
    --danger: #a33b2e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151714;
      --surface: #1e211d;
      --fg: #ecebe6;
      --muted: #9a9e96;
      --line: #32362f;
      --accent: #5fb89f;
      --accent-fg: #0f1411;
      --danger: #e07a6b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151714;
    --surface: #1e211d;
    --fg: #ecebe6;
    --muted: #9a9e96;
    --line: #32362f;
    --accent: #5fb89f;
    --accent-fg: #0f1411;
    --danger: #e07a6b;
    color-scheme: dark;
  }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    min-width: 0;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 16px;
    text-wrap: balance;
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    padding: 8px 14px;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 20px 0 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
  }
  li:first-child { border-top: 0; }
  li label {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  li.done label {
    color: var(--muted);
    text-decoration: line-through;
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex: none;
  }
  .delete {
    border: 0;
    background: none;
    color: var(--muted);
    padding: 4px 8px;
  }
  .delete:hover { color: var(--danger); }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .empty {
    padding: 24px 14px;
    text-align: center;
    color: var(--muted);
  }
  [hidden] { display: none !important; }
</style>

<main>
  <h1>To-do</h1>

  <form id="add-form" autocomplete="off">
    <input type="text" id="new-task" placeholder="What needs doing?" aria-label="New task" maxlength="200">
    <button type="submit" class="primary">Add</button>
  </form>

  <ul id="list" aria-live="polite"></ul>
  <p class="empty" id="empty" hidden>No tasks yet. Add one above.</p>

  <footer>
    <span id="count"></span>
    <button type="button" id="clear-done">Clear completed</button>
  </footer>
</main>

<script>
  (function () {
    var KEY = "simple-todo-items";
    var items = [];

    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        items = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(items)) items = [];
      } catch (e) {
        items = [];
      }
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(items));
      } catch (e) {
        /* Storage may be blocked; the list still works for this visit. */
      }
    }

    function render() {
      var list = document.getElementById("list");
      list.innerHTML = "";

      items.forEach(function (item) {
        var li = document.createElement("li");
        if (item.done) li.className = "done";

        var id = "task-" + item.id;
        var check = document.createElement("input");
        check.type = "checkbox";
        check.id = id;
        check.checked = item.done;
        check.addEventListener("change", function () {
          item.done = check.checked;
          save();
          render();
        });

        var label = document.createElement("label");
        label.htmlFor = id;
        label.textContent = item.text;

        var del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.setAttribute("aria-label", "Delete " + item.text);
        del.textContent = "Delete";
        del.addEventListener("click", function () {
          items = items.filter(function (i) { return i.id !== item.id; });
          save();
          render();
        });

        li.appendChild(check);
        li.appendChild(label);
        li.appendChild(del);
        list.appendChild(li);
      });

      var remaining = items.filter(function (i) { return !i.done; }).length;
      document.getElementById("empty").hidden = items.length > 0;
      document.getElementById("count").textContent =
        remaining + (remaining === 1 ? " task left" : " tasks left");
      document.getElementById("clear-done").hidden = items.every(function (i) { return !i.done; });
    }

    document.getElementById("add-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = document.getElementById("new-task");
      var text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      items.push({ id: Date.now() + Math.random().toString(36).slice(2, 6), text: text, done: false });
      input.value = "";
      save();
      render();
      input.focus();
    });

    document.getElementById("clear-done").addEventListener("click", function () {
      items = items.filter(function (i) { return !i.done; });
      save();
      render();
    });

    load();
    render();
  })();
</script>
