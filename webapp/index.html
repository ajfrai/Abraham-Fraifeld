<!doctype html>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Simple To-Do</title>
<style>
  /* Layout: one centered column, a header, the input, then the list and its footer. */
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --fg: #1d1f1c;
    --muted: #6b6f68;
    --line: #dcdad3;
    --accent: #1f6f5c;
    --accent-fg: #ffffff;
    --danger: #a33b2e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151714;
      --surface: #1e211d;
      --fg: #ecebe6;
      --muted: #9a9e96;
      --line: #32362f;
      --accent: #5fb89f;
      --accent-fg: #0f1411;
      --danger: #e07a6b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151714;
    --surface: #1e211d;
    --fg: #ecebe6;
    --muted: #9a9e96;
    --line: #32362f;
    --accent: #5fb89f;
    --accent-fg: #0f1411;
    --danger: #e07a6b;
    color-scheme: dark;
  }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    min-width: 0;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 16px;
    text-wrap: balance;
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    padding: 8px 14px;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 20px 0 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
  }
  li:first-child { border-top: 0; }
  li label {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  li.done label {
    color: var(--muted);
    text-decoration: line-through;
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex: none;
  }
  .delete {
    border: 0;
    background: none;
    color: var(--muted);
    padding: 4px 8px;
  }
  .delete:hover { color: var(--danger); }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .empty {
    padding: 24px 14px;
    text-align: center;
    color: var(--muted);
  }
  [hidden] { display: none !important; }
</style>

<main>
  <h1>To-do</h1>

  <form id="add-form" autocomplete="off">
    <input type="text" id="new-task" placeholder="What needs doing?" aria-label="New task" maxlength="200">
    <button type="submit" class="primary">Add</button>
  </form>

  <ul id="list" aria-live="polite"></ul>
  <p class="empty" id="empty" hidden>No tasks yet. Add one above.</p>

  <footer>
    <span id="count"></span>
    <button type="button" id="clear-done">Clear completed</button>
  </footer>
</main>

<script>
  (function () {
    var tasks = [];
    var listEl = document.getElementById("list");
    var emptyEl = document.getElementById("empty");
    var countEl = document.getElementById("count");
    var clearBtn = document.getElementById("clear-done");
    var input = document.getElementById("new-task");

    function api(method, url, body) {
      var opts = { method: method, headers: {} };
      if (body !== undefined) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      return fetch(url, opts).then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            throw new Error(data.error || ("Request failed (" + res.status + ")"));
          });
        }
        return res.status === 204 ? null : res.json();
      });
    }

    function showError(message) {
      countEl.textContent = message;
    }

    function render() {
      listEl.innerHTML = "";
      tasks.forEach(function (task) {
        var li = document.createElement("li");
        if (task.done) li.className = "done";

        var id = "task-" + task.id;
        var check = document.createElement("input");
        check.type = "checkbox";
        check.id = id;
        check.checked = task.done;
        check.addEventListener("change", function () {
          var next = check.checked;
          api("PATCH", "/api/tasks/" + task.id, { done: next })
            .then(function (updated) {
              task.done = updated.done;
              render();
            })
            .catch(function (err) { showError(err.message); check.checked = !next; });
        });

        var label = document.createElement("label");
        label.htmlFor = id;
        label.textContent = task.text;

        var del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.setAttribute("aria-label", "Delete " + task.text);
        del.textContent = "Delete";
        del.addEventListener("click", function () {
          api("DELETE", "/api/tasks/" + task.id)
            .then(function () {
              tasks = tasks.filter(function (t) { return t.id !== task.id; });
              render();
            })
            .catch(function (err) { showError(err.message); });
        });

        li.appendChild(check);
        li.appendChild(label);
        li.appendChild(del);
        listEl.appendChild(li);
      });

      var remaining = tasks.filter(function (t) { return !t.done; }).length;
      emptyEl.hidden = tasks.length > 0;
      countEl.textContent = remaining + (remaining === 1 ? " task left" : " tasks left");
      clearBtn.hidden = tasks.every(function (t) { return !t.done; });
    }

    function load() {
      api("GET", "/api/tasks")
        .then(function (data) { tasks = data; render(); })
        .catch(function (err) { showError("Could not load tasks: " + err.message); });
    }

    document.getElementById("add-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) { input.focus(); return; }
      api("POST", "/api/tasks", { text: text })
        .then(function (task) {
          tasks.push(task);
          input.value = "";
          render();
          input.focus();
        })
        .catch(function (err) { showError(err.message); });
    });

    clearBtn.addEventListener("click", function () {
      api("DELETE", "/api/tasks/completed")
        .then(function () {
          tasks = tasks.filter(function (t) { return !t.done; });
          render();
        })
        .catch(function (err) { showError(err.message); });
    });

    load();
  })();
</script>
