<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP App Host</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>MCP App Host</h1>
      <p class="brand-sub">renders any MCP app &middot; <code id="endpoint">loading…</code></p>
    </div>
  </div>

  <div class="topbar-actions">
    <span class="status" id="status" data-state="pending">
      <span class="status-dot"></span><span id="status-text">Loading</span>
    </span>
    <button type="button" class="ghost" id="theme-toggle"><span id="theme-label">Dark</span></button>
    <button type="button" class="ghost" id="inspector-toggle" aria-expanded="false">Inspector</button>
  </div>
</header>

<main class="layout">

  <aside class="sidebar">
    <section class="panel">
      <h2>Server</h2>
      <label class="field">
        <span>Registered MCP servers</span>
        <select id="server-select"></select>
      </label>
      <p class="hint" id="server-notes"></p>
      <dl class="kv" id="server-details"></dl>
    </section>

    <form id="tool-form" class="panel">
      <h2>Tool</h2>
      <label class="field">
        <span>Callable tools</span>
        <select id="tool-select"></select>
      </label>
      <p class="hint" id="tool-description"></p>

      <!-- Fields are generated from the tool's inputSchema. -->
      <div id="tool-fields"></div>

      <button type="submit" class="primary" id="run-button">Run tool</button>
      <p class="hint" id="tool-warning"></p>
    </form>
  </aside>

  <section class="stage" id="stage">
    <div class="stage-head">
      <div>
        <h2 id="stage-title">App</h2>
        <p class="hint" id="stage-sub">nothing mounted</p>
      </div>
      <div class="stage-actions">
        <span class="badge" id="standard-badge" hidden></span>
        <span class="badge" id="display-mode-badge">inline</span>
        <button type="button" class="ghost" id="exit-fullscreen" hidden>Exit fullscreen</button>
      </div>
    </div>

    <div class="stage-body" id="stage-body">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-inner">
          <div class="spinner" id="placeholder-spinner" hidden></div>
          <h3 id="placeholder-title">Pick a server and run a tool</h3>
          <p id="placeholder-text">
            This host speaks both widget standards — MCP Apps (SEP-1865) and the
            OpenAI Apps SDK — and picks the right one from the resource's mime type.
          </p>
        </div>
      </div>
    </div>
  </section>

  <aside class="inspector" id="inspector" hidden>
    <div class="inspector-head">
      <h2>Inspector</h2>
      <div>
        <button type="button" class="ghost small" id="clear-log">Clear</button>
        <button type="button" class="ghost small" id="close-inspector">Close</button>
      </div>
    </div>
    <div class="inspector-filters">
      <label><input type="checkbox" class="filter" value="host→app" checked> host→app</label>
      <label><input type="checkbox" class="filter" value="app→host" checked> app→host</label>
      <label><input type="checkbox" class="filter" value="host→server" checked> host→server</label>
    </div>
    <ol class="log" id="log"></ol>
  </aside>

</main>

<script type="module" src="/main.js"></script>
</body>
</html>
